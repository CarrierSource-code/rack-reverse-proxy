inherit_from: ../.rubocop.yml

Metrics/BlockLength:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/PredicateMatcher:
  Enabled: false

RSpec/SortMetadata:
  Enabled: false

RSpec/SpecFilePathFormat:
  CustomTransform:
    OpenAI: openai
